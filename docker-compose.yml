services:
  db:
    image: postgres:16
    container_name: examensecurity-db
    environment:
      POSTGRES_DB: ExamenSecurityDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Your_strong_password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: examensecurity-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Database=ExamenSecurityDb;Username=postgres;Password=Your_strong_password123;Port=5432"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
